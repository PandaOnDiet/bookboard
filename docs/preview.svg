<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Illustration: VS Code with a Claude Code chat on the left and the Bookboard panel on the right</title>
  <defs>
    <clipPath id="win"><rect width="1280" height="760" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
  <rect width="1280" height="760" fill="#1f1f1f"/>

  <!-- title bar -->
  <rect width="1280" height="34" fill="#181818"/>
  <text x="640" y="22" text-anchor="middle" fill="#9d9d9d" font-size="12">my-app — Visual Studio Code</text>
  <g fill="#9d9d9d"><rect x="1180" y="16" width="10" height="1.5"/><rect x="1212" y="12" width="9" height="9" fill="none" stroke="#9d9d9d"/><path d="M1243 12l9 9M1252 12l-9 9" stroke="#9d9d9d"/></g>

  <!-- activity bar -->
  <rect y="34" width="48" height="704" fill="#181818"/>
  <rect y="96" width="2" height="40" fill="#0078d4"/>
  <g fill="none" stroke="#868686" stroke-width="1.6">
    <rect x="15" y="52" width="16" height="20" rx="2"/>
    <circle cx="23" cy="116" r="7" stroke="#d7d7d7"/>
    <circle cx="22" cy="168" r="6"/><path d="M26.5 172.5l5 5"/>
    <circle cx="18" cy="214" r="3"/><circle cx="28" cy="224" r="3"/><path d="M18 217v10M28 221c0-5-10-4-10-4"/>
  </g>

  <!-- chat -->
  <rect x="48" y="34" width="752" height="704" fill="#1f1f1f"/>
  <text x="72" y="62" fill="#cccccc" font-size="11" font-weight="600" letter-spacing="1">CLAUDE CODE</text>
  <line x1="48" y1="76" x2="800" y2="76" stroke="#2b2b2b"/>

  <rect x="72" y="96" width="704" height="56" rx="8" fill="#2a2d2e" stroke="#3c3c3c"/>
  <text x="90" y="120" fill="#e0e0e0">Add a task to fix the login redirect losing returnTo,</text>
  <text x="90" y="140" fill="#e0e0e0">then start on the release notes.</text>

  <g fill="#9d9d9d" font-size="12.5">
    <circle cx="78" cy="181" r="3.5" fill="#4ec9b0"/>
    <text x="90" y="185"><tspan fill="#d7d7d7" font-weight="600">board</tspan>  add · “Fix <tspan font-weight="700">login redirect</tspan> losing returnTo”</text>
    <circle cx="78" cy="207" r="3.5" fill="#4ec9b0"/>
    <text x="90" y="211"><tspan fill="#d7d7d7" font-weight="600">board</tspan>  move · “release notes” → In progress</text>
  </g>

  <g fill="#d4d4d4">
    <text x="72" y="250">Added <tspan font-weight="700">Fix login redirect</tspan> to To do and moved <tspan font-weight="700">Write the release notes</tspan></text>
    <text x="72" y="271">to In progress. I'll draft them from the commits since the last tag and tick</text>
    <text x="72" y="292">the task when they're written.</text>
  </g>
  <g fill="#8b8b8b" font-size="12.5">
    <text x="72" y="324">📌 Note</text>
    <text x="142" y="324">＋ Task</text>
    <text x="210" y="324">📋 Close board</text>
  </g>

  <!-- prompt box -->
  <rect x="72" y="664" width="704" height="58" rx="8" fill="#252526" stroke="#3c3c3c"/>
  <text x="90" y="698" fill="#6e6e6e">Ask Claude to edit, explain or plan…</text>
  <circle cx="748" cy="693" r="13" fill="#d97757"/>
  <path d="M748 699v-12M742 693l6-6 6 6" stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- Bookboard panel -->
  <rect x="800" y="34" width="480" height="704" fill="#181818"/>
  <line x1="800" y1="34" x2="800" y2="738" stroke="#2b2b2b"/>

  <text x="824" y="74" fill="#f0f0f0" font-size="18" font-weight="700">my-app</text>
  <text x="1150" y="72" fill="#8b8b8b" font-size="12.5">↻ Refresh</text>
  <text x="1222" y="72" fill="#8b8b8b" font-size="12.5">Close</text>

  <text x="824" y="104" fill="#8b8b8b">Board for my-app</text>
  <rect x="824" y="116" width="390" height="30" rx="5" fill="#252526" stroke="#3c3c3c"/>
  <text x="836" y="135" fill="#6e6e6e">Or type a folder path…</text>
  <text x="1226" y="135" fill="#8b8b8b">use</text>

  <rect x="824" y="162" width="96" height="30" rx="5" fill="#0078d4"/>
  <text x="872" y="181" text-anchor="middle" fill="#ffffff" font-weight="600">☑ To do 2</text>
  <rect x="928" y="162" width="104" height="30" rx="5" fill="none" stroke="#3c3c3c"/>
  <text x="980" y="181" text-anchor="middle" fill="#8b8b8b">📌 Notes 1</text>

  <rect x="824" y="208" width="390" height="30" rx="5" fill="#252526" stroke="#3c3c3c"/>
  <text x="836" y="227" fill="#6e6e6e">Add a task…</text>
  <text x="1226" y="227" fill="#8b8b8b">add</text>

  <!-- In progress -->
  <rect x="824" y="256" width="432" height="92" rx="8" fill="none" stroke="#3a3a3a"/>
  <text x="840" y="280" fill="#e6e6e6" font-weight="600">In progress <tspan fill="#8b8b8b" font-weight="400">1</tspan></text>
  <text x="840" y="308" fill="#d4d4d4">Write the <tspan font-weight="700">release notes</tspan></text>
  <text x="840" y="332" fill="#e6e6e6" font-size="12.5">✓ Done</text>
  <text x="900" y="332" fill="#8b8b8b" font-size="12.5">Park</text>
  <text x="942" y="332" fill="#8b8b8b" font-size="12.5">Back</text>

  <!-- To do -->
  <rect x="824" y="364" width="432" height="92" rx="8" fill="none" stroke="#3a3a3a"/>
  <text x="840" y="388" fill="#e6e6e6" font-weight="600">To do <tspan fill="#8b8b8b" font-weight="400">1</tspan></text>
  <text x="840" y="416" fill="#d4d4d4">Fix <tspan font-weight="700">login redirect</tspan> losing <tspan font-family="ui-monospace, Consolas, monospace" fill="#ce9178">returnTo</tspan></text>
  <text x="840" y="440" fill="#e6e6e6" font-size="12.5">▶ Start</text>
  <text x="900" y="440" fill="#e6e6e6" font-size="12.5">✓ Done</text>
  <text x="960" y="440" fill="#8b8b8b" font-size="12.5">Park</text>

  <!-- Parked -->
  <rect x="824" y="472" width="432" height="92" rx="8" fill="none" stroke="#3a3a3a"/>
  <text x="840" y="496" fill="#e6e6e6" font-weight="600">Parked <tspan fill="#8b8b8b" font-weight="400">1</tspan></text>
  <text x="840" y="524" fill="#8b8b8b">Dark mode — waiting on the design</text>
  <text x="840" y="548" fill="#8b8b8b" font-size="12.5">Unpark</text>

  <!-- Done -->
  <rect x="824" y="580" width="432" height="92" rx="8" fill="none" stroke="#3a3a3a"/>
  <text x="840" y="604" fill="#e6e6e6" font-weight="600">Done <tspan fill="#8b8b8b" font-weight="400">1</tspan></text>
  <text x="840" y="632" fill="#8b8b8b" text-decoration="line-through">Add <tspan font-weight="700">rate limiting</tspan> to the API</text>
  <text x="840" y="656" fill="#8b8b8b" font-size="12.5">Reopen</text>

  <!-- status bar -->
  <rect y="738" width="1280" height="22" fill="#181818"/>
  <rect y="738" width="34" height="22" fill="#0078d4"/>
  <path d="M11 745l4 4-4 4M23 745l-4 4 4 4" stroke="#ffffff" stroke-width="1.4" fill="none"/>
  <text x="48" y="753" fill="#9d9d9d" font-size="11.5">main</text>
  <text x="1260" y="753" text-anchor="end" fill="#9d9d9d" font-size="11.5">Illustration · drawn from the panel's code</text>
  </g>
</svg>
